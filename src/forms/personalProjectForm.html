<html>

    <body>

        <form id="input-form">

            <div>

                <label for="name">
                    Name:
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >

            </div>


            <div>

                <label for="description">
                    Description:
                </label>

                <textarea
                    id="description"
                    name="description"
                    required
                ></textarea>

            </div>


            <div>

                <button type="submit">
                    Submit
                </button>

                <button
                    id="form-cancel-button"
                    type="button"
                >
                    Cancel
                </button>

            </div>

        </form>

    </body>

</html>
