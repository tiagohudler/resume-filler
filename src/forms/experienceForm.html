<html>

    <body>

        <form id="input-form">

            <div>
                <label for="company">
                    Company:
                </label>

                <input
                    type="text"
                    id="company"
                    name="company"
                    required
                >
            </div>


            <div>
                <label for="start-date">
                    Start Date:
                </label>

                <input
                    type="date"
                    id="start-date"
                    name="start-date"
                    required
                >
            </div>


            <div>
                <label for="end-date">
                    End Date:
                </label>

                <input
                    type="date"
                    id="end-date"
                    name="end-date"
                    required
                >
            </div>


            <div>

                <label for="current-job">
                    Is this you current job?
                </label>

                <input
                    type="checkbox"
                    id="current-job"
                    name="current-job"
                >

            </div>


            <div>

                <label for="description">
                    Description:
                </label>

                <textarea
                    id="description"
                    name="description"
                    required
                ></textarea>

            </div>


            <div>

                <button type="submit">
                    Submit
                </button>

                <button
                    id="form-cancel-button"
                    type="button"
                >
                    Cancel
                </button>

            </div>

        </form>

    </body>

</html>
