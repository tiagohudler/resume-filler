<html>
    <head>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <script type="module" src="../../dist/sidepanel/sidepanel.js" defer></script>

        <div id="sidePanel">
            <h1>Resume Filler</h1>
            <div id="urls">
                <div class="section-header">
                    <h2>URLs and Websites</h2>
                </div>
                <ul>
                    <li>
                        <div>LinkedIn</div>
                        <button name="linkedin" type="button" class="add-item-button add-url-button">+</button>
                    </li>
                    <li>
                        <div>GitHub</div>
                        <button name="github" type="button" class="add-item-button add-url-button">+</button>
                    </li>
                    <li>
                        <div>Website</div>
                        <button name="website" type="button" class="add-item-button add-url-button">+</button>
                    </li>
                </ul>
            </div>
            <div id="experience">
                <div class="section-header">
                    <h2>Experience</h2>
                    <button id="add-experience-button" type="button" class="add-item-button">+</button>
                </div>
            </div>
            <div id="personal-projects">
                <div class="section-header">
                    <h2>Personal Projects and Others</h2>
                    <button id="add-personal-project-button" type="button" class="add-item-button">+</button>
                </div>
            </div>

            <!-- this is used for input forms-->
            <div id="form-container">
                <div id="form-overlay"></div>
            </div> 
        </div>
    </body>
</html>
